<section class="md:py-20 py-10 lg:px-10 xl:px-45">
  <div class="px-8">
    <h1 class="mb-6 md:text-[48px] text-[30px] font-semibold text-[#1a1a1a]">About POSH</h1>

    <p class="mb-15 max-w-175 text-[20px] leading-[1.7] text-[#6a6a6a]">
      POSH is a premium website template designed for modern web experiences. Built with attention
      to detail, it provides everything you need to create stunning, responsive websites.
    </p>
  </div>

  <div class="grid grid-cols-1 gap-10 md:grid-cols-3">
    @for (card of cards; track card.title) {
      <div class="rounded-b-md border-t-[3px] border-[#007AFF] bg-[#f9f9f9] p-8">
        <h3 class="mb-4 text-[22px] font-semibold text-[#1a1a1a]">{{ card.title }}</h3>

        <p class="text-[15px] leading-[1.7] text-[#6a6a6a]">{{ card.description }}</p>
      </div>
    }
  </div>
</section>
