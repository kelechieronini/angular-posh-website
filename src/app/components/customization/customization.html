<div class="px-8 mb-15">
  <h2 class="mb-4 text-[28px] font-semibold text-[#1a1a1a]">Customization</h2>

  <p class="mb-6 text-[16px] leading-[1.7] text-[#6a6a6a]">
    Posh is built with Tailwind CSS, so customizing the look and feel is simple. Here are the
    most common changes you will make.
  </p>

  <div class="flex flex-col gap-6">
    @for (section of sections; track section.title) {
      <div>
        <h3 class="mb-2 text-[18px] font-semibold text-[#1a1a1a]">{{ section.title }}</h3>

        <p class="text-[15px] leading-[1.6] text-[#6a6a6a]">{{ section.description }}</p>
      </div>
    }
  </div>
</div>
