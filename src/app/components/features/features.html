<div class="px-8 mb-15">
  <h2 class="mb-6 text-[28px] font-semibold text-[#1a1a1a]">Features</h2>

  <div class="grid grid-cols-1 gap-8 md:grid-cols-2 lg:grid-cols-3">
    @for (feature of features; track feature.title) {
      <div class="rounded-lg border border-[#e8e8e8] p-6">
        <h3 class="mb-2 text-[18px] font-semibold text-[#1a1a1a]">{{ feature.title }}</h3>

        <p class="text-[15px] leading-[1.6] text-[#6a6a6a]">{{ feature.description }}</p>
      </div>
    }
  </div>
</div>
