<div class="px-8 mb-15">
  <h2 class="mb-6 text-[28px] font-semibold text-[#1a1a1a]">Frequently Asked Questions</h2>

  <div class="flex flex-col gap-4">
    @for (faq of faqs; track faq.question) {
      <div class="rounded-lg border border-[#e8e8e8] p-6">
        <h3 class="mb-2 text-[16px] font-semibold text-[#1a1a1a]">{{ faq.question }}</h3>

        <p class="text-[15px] leading-[1.6] text-[#6a6a6a]">{{ faq.answer }}</p>
      </div>
    }
  </div>
</div>
